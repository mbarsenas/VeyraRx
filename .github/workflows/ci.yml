name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VEYRA_DATA_PROVIDER: data-api
          VEYRA_AUTH_MODE: production
          NEON_AUTH_BASE_URL: https://auth.invalid
          NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-secret-at-least-32-characters
          NEON_DATA_API_URL: https://data.invalid
          NEXT_PUBLIC_APP_URL: http://localhost:3000
